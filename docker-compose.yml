version: "3.9"

services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: "localhost"
      N8N_PORT: 5678
      N8N_PROTOCOL: "http"
      GENERIC_TIMEZONE: "America/Sao_Paulo"
    volumes:
      - ./n8n:/home/node/.n8n
    restart: unless-stopped

  postgres:
    image: postgres:17.2
    container_name: evolution-postgres
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
      POSTGRES_DB: evolution
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    
  evolution-api:
    image: atendai/evolution-api
    container_name: evolution-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./evolution:/app/instances
    restart: unless-stopped
